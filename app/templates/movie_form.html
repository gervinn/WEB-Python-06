{% extends "base.html" %}
{% block title %}{{ page_title }}{% endblock %}
{% block content %}
<div class="form-card wide">
    <h2>{{ page_title }}</h2>
    <form method="post" class="form-grid">
        <label>Назва
            <input type="text" name="title" value="{{ movie.title if movie else '' }}" required>
        </label>
        <label>Жанр
            <input type="text" name="genre" value="{{ movie.genre if movie else '' }}" required>
        </label>
        <label>Тривалість (хв)
            <input type="number" name="duration_minutes" value="{{ movie.duration_minutes if movie else '' }}" required>
        </label>
        <label>Вікове обмеження
            <input type="number" name="age_limit" value="{{ movie.age_limit if movie else 0 }}" required>
        </label>
        <label class="full-width">Опис
            <textarea name="description" rows="5" required>{{ movie.description if movie else '' }}</textarea>
        </label>
        <button type="submit" class="btn">Зберегти</button>
    </form>
</div>
{% endblock %}
