{% extends "base.html" %}
{% block title %}Вхід{% endblock %}
{% block content %}
<div class="form-card">
    <h2>Вхід</h2>
    <form action="/login" method="post" class="form-grid">
        <label>Логін
            <input type="text" name="username" required>
        </label>
        <label>Пароль
            <input type="password" name="password" required>
        </label>
        <button type="submit" class="btn">Увійти</button>
    </form>
    <p class="muted">Тестові акаунти: admin/admin123 та user/user123</p>
</div>
{% endblock %}
