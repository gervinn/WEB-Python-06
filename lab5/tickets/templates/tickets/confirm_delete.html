{% extends 'tickets/base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="form-panel danger-panel">
    <h1>{{ title }}</h1>
    <p>Ви дійсно хочете видалити об’єкт: <strong>{{ object }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button class="btn danger" type="submit">Так, видалити</button>
        <a class="btn secondary" href="javascript:history.back()">Скасувати</a>
    </form>
</div>
{% endblock %}
